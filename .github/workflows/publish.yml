name: publish

# Renders the README results block + site trend data from the durable official
# store, then deploys the static site to GitHub Pages.
#
# This job does NOT measure anything — official numbers are produced on the
# maintainer's benchmark PC and committed to data/official/ (hosted runners are
# too noisy for trustworthy timings; see docs/plans/2026-06-10-results-representation.md).
# Here we only render site/data/trends.json from committed JSON and deploy the site.
#
# This workflow never commits back to main. The README results block is rendered
# and committed by the author in the same PR that changes data/official/ or the
# renderer, and the smoke `quality` job fails if README is stale (it re-renders and
# diffs). That keeps README in sync without CI pushing to a protected branch.
# site/data/trends.json is gitignored — it is rebuilt here and shipped as a Pages
# artifact, never committed.

on:
  push:
    branches: [main]
    paths:
      - "data/official/**"
      - "site/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read # read-only: this workflow never pushes to the branch
  pages: write # deploy to GitHub Pages
  id-token: write # OIDC token for the Pages deployment

# Serialize publishes so a README commit + Pages deploy never race a later push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true

      - name: Sync project
        run: uv sync --frozen

      - name: Render trends for the Pages site
        # Renders site/data/trends.json (the only artifact input). README is also
        # written into the runner checkout but never committed — the committed
        # README is kept fresh by the author + the smoke `quality` gate instead.
        run: >
          uv run typebench render
          --results-dir data/official
          --readme README.md
          --trends site/data/trends.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
